<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>녹색바구니 영업 빙고 — 301위 ~ 400위</title>
<style>
  :root {
    --bg: #f4f6f4;
    --surface: #ffffff;
    --ink: #1a2420;
    --ink-2: #5a6a62;
    --ink-3: #8a978f;
    --line: #e2e8e3;
    --accent: #1e7a46;
    --accent-soft: #e3f2e9;
    --accent-deep: #14532d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Pretendard", "Malgun Gothic", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 1240px; margin: 0 auto; }

  .topnav { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .sub { font-size: 13px; color: var(--ink-2); }
  .navbtns { display: flex; gap: 8px; }
  .navbtn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 700; color: var(--ink-2);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 14px; cursor: pointer; text-decoration: none;
  }
  .navbtn:hover { border-color: var(--accent); color: var(--accent); }
  .navbtn svg { width: 15px; height: 15px; }

  /* 미니 대시보드 */
  .dash {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin: 16px 0 20px;
  }
  .tile {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 18px;
  }
  .tile .label { font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
  .tile .value { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .tile .unit { font-size: 13px; font-weight: 600; color: var(--ink-3); margin-left: 2px; }
  .tile .bar { margin-top: 10px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .tile .bar > div { height: 100%; width: 0%; background: var(--accent); border-radius: 3px; transition: width .25s ease; }

  /* 페이지 탭 */
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tab {
    font-size: 13px; font-weight: 700; color: var(--ink-2); text-decoration: none;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px 10px 0 0; padding: 9px 18px;
  }
  .tab:hover { color: var(--accent); border-color: var(--accent); }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  .hint { font-size: 12.5px; color: var(--ink-2); }
  button.reset {
    font: inherit; font-size: 12.5px; color: var(--ink-2);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  button.reset:hover { color: #b91c1c; border-color: #fca5a5; }

  /* 빙고판 */
  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
  .cell {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 8px 8px;
    min-height: 86px;
    cursor: pointer;
    display: flex; flex-direction: column; justify-content: space-between;
    transition: background .15s ease, border-color .15s ease, transform .05s ease;
    user-select: none;
  }
  .cell:hover { border-color: var(--accent); }
  .cell:active { transform: scale(0.97); }
  .cell .rank { position: absolute; top: 6px; right: 8px; font-size: 10px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .cell .name {
    font-size: 12px; font-weight: 700; line-height: 1.3;
    word-break: keep-all; overflow-wrap: anywhere;
    padding-right: 18px;
  }
  .cell .amt {
    font-size: 12.5px; font-weight: 700; color: var(--ink-2);
    font-variant-numeric: tabular-nums; margin-top: 6px;
  }
  .cell.done { background: var(--accent); border-color: var(--accent-deep); }
  .cell.done .name { color: #ffffff; }
  .cell.done .amt { color: #d7f0e2; }
  .cell.done .rank { color: #a8d9bf; }
  .cell.done::after {
    content: "✓";
    position: absolute; bottom: 6px; right: 8px;
    font-size: 12px; font-weight: 800; color: #ffffff;
  }
  /* 완성된 빙고 줄에 속한 칸 */
  .cell.done.line { background: var(--accent-deep); box-shadow: inset 0 0 0 2px #facc15; }

  @media (max-width: 900px) { .grid { grid-template-columns: repeat(5, 1fr); } }
  @media (max-width: 520px) { .grid { grid-template-columns: repeat(2, 1fr); } }

  /* 왼쪽 상단 뒤로가기 (플랫폼 홈) — 문서 플랫폼과 통일 */
  .back-home {
    position: fixed; top: 16px; left: 16px; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    width: 46px; height: 46px; border-radius: 12px;
    background: #fff; color: #333; box-shadow: 0 2px 8px rgba(0,0,0,.15);
    text-decoration: none;
  }
  .back-home:hover { background: #f4f4f4; }
  .back-home svg { width: 21px; height: 21px; }
  @media (max-width: 1380px) { .topnav { padding-left: 56px; } }

  /* 문의 옴(노란색) 상태 */
  .cell.ask { background: #fef3c7; border-color: #f59e0b; }
  .cell.ask .name { color: #92400e; }
  .cell.ask .amt { color: #b45309; }
  .cell.ask::after { content: "?"; position: absolute; bottom: 6px; right: 8px;
                     font-size: 12px; font-weight: 800; color: #b45309; }
  .tile .bar > .ask-bar { background: #f59e0b; }
  /* 기관 검색 */
  .searchbox { display: inline-flex; align-items: center; gap: 6px;
               background: var(--surface); border: 1px solid var(--line);
               border-radius: 10px; padding: 7px 12px; }
  .searchbox svg { width: 15px; height: 15px; color: var(--ink-3); }
  .searchbox input { border: none; outline: none; font-size: 13px; width: 190px;
                     background: transparent; color: var(--ink); }
  .cell.dimmed { opacity: .22; }
  .cell.hit { box-shadow: 0 0 0 2px var(--accent); }
  .search-results { font-size: 12.5px; color: var(--ink-2); margin: -4px 0 10px; }
  .search-results a { color: var(--accent); font-weight: 700; text-decoration: none; margin-right: 12px; }
  .search-results a:hover { text-decoration: underline; }
</style>
</head>

<script>
const DATA = [{"name": "대한장애인체육회", "amount": 180.0}, {"name": "부산대학교치과병원", "amount": 180.0}, {"name": "한국청소년정책연구원", "amount": 180.0}, {"name": "단양관광공사", "amount": 176.0}, {"name": "한국산업은행", "amount": 175.0}, {"name": "경상남도밀양시시설관리공단", "amount": 175.0}, {"name": "서울특별시관악구시설관리공단", "amount": 174.0}, {"name": "국립항공박물관", "amount": 172.0}, {"name": "한국건강가정진흥원", "amount": 172.0}, {"name": "서울특별시영등포구시설관리공단", "amount": 168.0}, {"name": "장수한우지방공사", "amount": 168.0}, {"name": "식품안전정보원", "amount": 166.0}, {"name": "코레일테크", "amount": 165.0}, {"name": "문경관광공사", "amount": 165.0}, {"name": "장애인기업종합지원센터", "amount": 160.0}, {"name": "한국문화관광연구원", "amount": 160.0}, {"name": "국가생명윤리정책원", "amount": 158.0}, {"name": "건설기술교육원", "amount": 158.0}, {"name": "한전MCS", "amount": 157.0}, {"name": "한국조세재정연구원", "amount": 156.0}, {"name": "강원특별자치도속초시시설관리공단", "amount": 156.0}, {"name": "충청남도보령시시설관리공단", "amount": 154.0}, {"name": "한국보건의료인국가시험원", "amount": 153.0}, {"name": "춘천도시공사", "amount": 152.0}, {"name": "한식진흥원", "amount": 148.0}, {"name": "양평공사", "amount": 146.0}, {"name": "태권도진흥재단", "amount": 145.0}, {"name": "한국예술인복지재단", "amount": 145.0}, {"name": "구리농수산물공사", "amount": 144.0}, {"name": "한국장애인개발원", "amount": 143.0}, {"name": "안양도시공사", "amount": 143.0}, {"name": "한국여성정책연구원", "amount": 141.0}, {"name": "대구달성군시설관리공단", "amount": 138.0}, {"name": "국악방송", "amount": 137.0}, {"name": "중소벤처기업연구원", "amount": 136.0}, {"name": "한국원산지정보원", "amount": 135.0}, {"name": "게임물관리위원회", "amount": 135.0}, {"name": "서울특별시성북구도시관리공단", "amount": 135.0}, {"name": "함안지방공사", "amount": 135.0}, {"name": "농업정책보험금융원", "amount": 134.0}, {"name": "서울특별시용산구시설관리공단", "amount": 132.0}, {"name": "경상남도창원레포츠파크", "amount": 132.0}, {"name": "국립광주과학관", "amount": 131.0}, {"name": "농림식품기술기획평가원", "amount": 130.0}, {"name": "경상남도양산시시설관리공단", "amount": 130.0}, {"name": "한국특허전략개발원", "amount": 128.0}, {"name": "경기도가평군시설관리공단", "amount": 126.0}, {"name": "한국문화정보원", "amount": 125.0}, {"name": "영양고추유통공사", "amount": 124.0}, {"name": "국립중앙의료원", "amount": 123.0}, {"name": "울산광역시남구도시관리공단", "amount": 121.0}, {"name": "한국상하수도협회", "amount": 120.0}, {"name": "한국지식재산연구원", "amount": 120.0}, {"name": "경기교통공사", "amount": 120.0}, {"name": "양주도시공사", "amount": 120.0}, {"name": "국방전직교육원", "amount": 116.0}, {"name": "하남도시공사", "amount": 116.0}, {"name": "한국환경연구원", "amount": 112.0}, {"name": "서울특별시양천구시설관리공단", "amount": 111.0}, {"name": "경기도안성시시설관리공단", "amount": 110.0}, {"name": "한국저작권보호원", "amount": 108.0}, {"name": "사천시시설관리공단", "amount": 108.0}, {"name": "국립해양과학관", "amount": 107.0}, {"name": "산업연구원", "amount": 107.0}, {"name": "한국법무보호복지공단", "amount": 104.0}, {"name": "광주광산구시설관리공단", "amount": 104.0}, {"name": "서울특별시중구시설관리공단", "amount": 104.0}, {"name": "울주군시설관리공단", "amount": 104.0}, {"name": "영상물등급위원회", "amount": 101.0}, {"name": "강릉관광개발공사", "amount": 98.0}, {"name": "구리도시공사", "amount": 96.0}, {"name": "서울특별시종로구시설관리공단", "amount": 94.0}, {"name": "제주에너지공사", "amount": 94.0}, {"name": "대한건설기계안전관리원", "amount": 92.0}, {"name": "광주광역시서구시설관리공단", "amount": 92.0}, {"name": "거제해양관광개발공사", "amount": 91.0}, {"name": "공간정보품질관리원", "amount": 90.0}, {"name": "한국전력국제원자력대학원대학교", "amount": 90.0}, {"name": "한국출판문화산업진흥원", "amount": 90.0}, {"name": "경상북도영천시시설관리공단", "amount": 90.0}, {"name": "의정부도시공사", "amount": 88.0}, {"name": "한국특허정보원", "amount": 87.0}, {"name": "인천광역시미추홀구시설관리공단", "amount": 86.0}, {"name": "한국에너지정보문화재단", "amount": 84.0}, {"name": "강원특별자치도원주시시설관리공단", "amount": 83.0}, {"name": "국립부산과학관", "amount": 82.0}, {"name": "부산광역시남구시설관리공단", "amount": 82.0}, {"name": "김포도시관리공사", "amount": 81.0}, {"name": "경상남도창녕군시설관리공단", "amount": 81.0}, {"name": "통일연구원", "amount": 80.0}, {"name": "한국지식재산보호원", "amount": 80.0}, {"name": "한국청소년상담복지개발원", "amount": 79.0}, {"name": "서울특별시성동구도시관리공단", "amount": 79.0}, {"name": "서울특별시송파구시설관리공단", "amount": 77.0}, {"name": "무역안보관리원", "amount": 75.0}, {"name": "서울특별시서대문구도시관리공단", "amount": 75.0}, {"name": "한국국방연구원", "amount": 73.0}, {"name": "한국제품안전관리원", "amount": 73.0}, {"name": "서울특별시마포구시설관리공단", "amount": 73.0}, {"name": "한국해외인프라도시개발지원공사", "amount": 72.0}];
const OFFSET = 300;              // 이 페이지 첫 칸의 전체 순위 - 1
const KEY = "greenbasket-bingo-p4";
const N = 10;

let done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
const AKEY = KEY + "-ask";
let asked = new Set(JSON.parse(localStorage.getItem(AKEY) || "[]"));

const grid = document.getElementById("grid");
const fmt = (n) => n.toLocaleString("ko-KR");
// 백만원 단위 값을 "956억 2,100만원" 형태로 변환
const fmtEok = (mn) => {
  const eok = Math.floor(mn / 100);        // 1억 = 100백만원
  const man = Math.round((mn % 100) * 100); // 나머지 백만원 → 만원 단위
  if (eok === 0) return `${fmt(man)}만원`;
  if (man === 0) return `${fmt(eok)}억원`;
  return `${fmt(eok)}억 ${fmt(man)}만원`;
};

DATA.forEach((d, i) => {
  const rank = OFFSET + i + 1;
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.dataset.i = i;
  cell.title = `${rank}위 · ${d.name} · ${fmtEok(d.amount)}`;
  cell.innerHTML =
    `<span class="rank">${rank}</span>` +
    `<span class="name">${d.name}</span>` +
    `<span class="amt">${fmtEok(d.amount)}</span>`;
  cell.addEventListener("click", () => {
    /* 없음 → 문의 옴(노랑) → 영업 성공(초록) → 해제 순환 */
    if (done.has(i)) { done.delete(i); }
    else if (asked.has(i)) { asked.delete(i); done.add(i); }
    else { asked.add(i); }
    localStorage.setItem(KEY, JSON.stringify([...done]));
    localStorage.setItem(AKEY, JSON.stringify([...asked]));
    render();
  });
  grid.appendChild(cell);
});

function completedLines() {
  const lines = [];
  for (let r = 0; r < N; r++) lines.push([...Array(N)].map((_, c) => r * N + c)); // 가로
  for (let c = 0; c < N; c++) lines.push([...Array(N)].map((_, r) => r * N + c)); // 세로
  lines.push([...Array(N)].map((_, k) => k * N + k));            // 대각선 ↘
  lines.push([...Array(N)].map((_, k) => k * N + (N - 1 - k)));  // 대각선 ↙
  return lines.filter(line => line.every(i => done.has(i)));
}

function render() {
  const lineCells = new Set(completedLines().flat());
  grid.querySelectorAll(".cell").forEach((cell) => {
    const i = +cell.dataset.i;
    cell.classList.toggle("done", done.has(i));
    cell.classList.toggle("ask", !done.has(i) && asked.has(i));
    cell.classList.toggle("line", lineCells.has(i));
  });
  const cnt = done.size;
  document.getElementById("stat-total").textContent = DATA.length;
  document.getElementById("stat-done").textContent = cnt;
  document.getElementById("stat-rate").textContent = ((cnt / DATA.length) * 100).toFixed(1);

    html += " · 다른 페이지에도 없음";
  }
  resultsBox.innerHTML = html;
  if (first) first.scrollIntoView({ block: "center", behavior: "smooth" });
}
searchInput.addEventListener("input", applySearch);
const q0 = new URLSearchParams(location.search).get("q");
if (q0) searchInput.value = q0;

render();
